---
apiVersion: v1
kind: Namespace
metadata:
  name: pod
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pod-volume-claim
  namespace: pod
spec:
  storageClassName: ibmc-block-gold
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: pod
spec:
  volumes:
  - name: pod-volume
    persistentVolumeClaim:
      claimName: pod-volume-claim
  containers:
  - name: pod-container
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - mountPath: "/mnt/disk"
      name: pod-volume
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: pod
  labels:
    app: pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod
  template:
    metadata:
      labels:
        app: pod
    spec:
      volumes:
      - name: pod-volume
        persistentVolumeClaim:
          claimName: pod-volume-claim
      containers:
      - image: nginx
        name: nginx
        volumeMounts:
        - mountPath: "/files"
          name: pod-volume
